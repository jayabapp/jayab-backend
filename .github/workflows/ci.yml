name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Pinned to match the @prisma/client version resolved in yarn.lock (6.19.0).
      # The `prisma` CLI is NOT a declared dependency of this repo, so a bare
      # `npx prisma` pulls the latest major (7.x) from the registry, which rejects
      # this v6 schema. Keep this in sync with @prisma/client, or better: add
      # `prisma` to devDependencies and drop the pin.
      - name: Generate Prisma client
        run: npx prisma@6.19.0 generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Non-blocking for now: the existing codebase has 71 eslint errors.
      # Flip to a blocking step once those are cleaned up.
      - name: Lint
        continue-on-error: true
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: npx nest build

      - name: Unit tests
        run: npx jest --ci
